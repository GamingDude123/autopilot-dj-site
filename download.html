<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1030">
<title>Download Autopilot DJ</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="icon.png">
<link rel="canonical" href="https://autopilotdj.com/download">
<meta name="description" content="Download the latest Autopilot DJ for Mac or Windows. Free for 7 days.">
<style>
  :root { --ink: #f4f0ff; --dim: #b4aad6; --a: #ff9ad5; --b: #8fe6ff; --go: #b9ffd6; --edge: rgba(255,255,255,.16); --glass: rgba(255,255,255,.07); --bg: #1a1030;
          --font: "Outfit", ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; --ease: cubic-bezier(.2,.7,.2,1); }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--font); color: var(--ink); line-height: 1.55; min-height: 100vh; background: var(--bg); overflow-x: hidden; }
  .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 0 20px; }

  /* background glow that drifts as you scroll */
  .orb { position: fixed; z-index: 0; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(90px); opacity: .5; pointer-events: none; will-change: transform; }
  .orb.o1 { left: -30vmax; top: -25vmax; background: radial-gradient(circle, #5a2fa3, transparent 65%); }
  .orb.o2 { right: -32vmax; top: 20vh; background: radial-gradient(circle, #1d5f8c, transparent 65%); }
  .orb.o3 { left: 10vmax; bottom: -45vmax; background: radial-gradient(circle, #8a2f7a, transparent 65%); opacity: .35; }
  #bar { position: fixed; z-index: 10; left: 0; top: 0; height: 3px; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, var(--a), var(--b)); }

  header { padding: 22px 0 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: .2px; display: flex; align-items: center; gap: 10px; }
  .brand img { filter: drop-shadow(0 4px 14px rgba(255,154,213,.35)); }
  .grad { background: linear-gradient(90deg, var(--a), var(--b), var(--a)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 6s linear infinite; }
  .soon { font-size: 13px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--edge); background: var(--glass); color: var(--go); display: inline-flex; align-items: center; gap: 8px; }
  .soon i { width: 8px; height: 8px; border-radius: 50%; background: var(--go); box-shadow: 0 0 0 0 rgba(185,255,214,.6); animation: ping 1.8s infinite; }

  .hero { padding: 54px 0 10px; text-align: center; }
  h1 { font-size: clamp(36px, 6.4vw, 64px); line-height: 1.05; margin: 0 0 16px; letter-spacing: -.8px; }
  .lead { font-size: clamp(17px, 2.4vw, 21px); color: var(--dim); max-width: 640px; margin: 0 auto 24px; }
  .pills { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .pills span { padding: 8px 14px; border-radius: 99px; background: var(--glass); border: 1px solid var(--edge); font-size: 14.5px; backdrop-filter: blur(6px); }

  /* the DJ rig */
  .stage { position: relative; max-width: 780px; margin: 38px auto 0; animation: float 7s ease-in-out infinite; }
  .stage svg { width: 100%; height: auto; display: block; overflow: visible; }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 3.2s linear infinite; }
  .spin.rev { animation-duration: 4.6s; animation-direction: reverse; }
  .arm { transform-box: fill-box; transform-origin: 85% 10%; animation: sway 5s ease-in-out infinite alternate; }
  .vu rect { transform-box: fill-box; transform-origin: 50% 100%; animation: vu .8s ease-in-out infinite alternate; }
  .vu rect:nth-child(2) { animation-duration: .6s; } .vu rect:nth-child(3) { animation-duration: .95s; } .vu rect:nth-child(4) { animation-duration: .7s; }
  .vu rect:nth-child(5) { animation-duration: .55s; } .vu rect:nth-child(6) { animation-duration: .9s; } .vu rect:nth-child(7) { animation-duration: .65s; } .vu rect:nth-child(8) { animation-duration: .8s; }
  .fa { animation: slide 2.7s ease-in-out infinite alternate; } .fb { animation: slide 3.3s ease-in-out infinite alternate-reverse; }
  .xf { animation: xf 3.6s ease-in-out infinite alternate; }
  .chip { position: absolute; padding: 7px 12px; border-radius: 99px; font-size: 13px; background: rgba(26,16,48,.75); border: 1px solid var(--edge); backdrop-filter: blur(8px); white-space: nowrap; animation: float 5s ease-in-out infinite; }
  .chip.c1 { left: 1%; top: 6%; color: var(--a); } .chip.c2 { right: 1%; top: 14%; color: var(--b); animation-delay: -1.5s; }
  .chip.c3 { left: 8%; bottom: 2%; color: var(--go); animation-delay: -3s; } .chip.c4 { right: 6%; bottom: 0; color: #ffd98f; animation-delay: -2.2s; }

  .marquee { margin: 46px -20px 0; overflow: hidden; border-block: 1px solid var(--edge); background: rgba(255,255,255,.04); -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
  .marquee div { display: flex; width: max-content; animation: marq 32s linear infinite; }
  .marquee span { padding: 13px 22px; font-weight: 600; letter-spacing: 2px; font-size: 14px; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
  .marquee span::after { content: "\2726"; margin-left: 44px; color: var(--a); }

  h2 { font-size: clamp(26px, 4vw, 36px); margin: 0 0 20px; letter-spacing: -.3px; }
  section { padding: 56px 0 8px; }
  .eyebrow { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--b); margin-bottom: 8px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; }
  .card { position: relative; padding: 22px 22px 20px; border-radius: 20px; background: var(--glass); border: 1px solid var(--edge); transition: transform .35s var(--ease), border-color .35s, background .35s, box-shadow .35s; }
  .card:hover { transform: translateY(-6px); border-color: rgba(143,230,255,.5); background: rgba(255,255,255,.1); box-shadow: 0 18px 40px rgba(0,0,0,.28), 0 0 30px rgba(143,230,255,.12); }
  .ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 14px; background: linear-gradient(135deg, rgba(255,154,213,.25), rgba(143,230,255,.25)); border: 1px solid var(--edge); }
  .ico svg { width: 24px; height: 24px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .card h3 { margin: 0 0 6px; font-size: 19px; }
  .card p { margin: 0; color: var(--dim); font-size: 15px; }

  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; counter-reset: s; }
  .step { position: relative; padding: 24px 22px; border-radius: 20px; background: var(--glass); border: 1px solid var(--edge); }
  .step::before { counter-increment: s; content: counter(s); display: block; font-size: 54px; font-weight: 800; line-height: 1; margin-bottom: 8px; background: linear-gradient(135deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .step h3 { margin: 0 0 4px; font-size: 19px; } .step p { margin: 0; color: var(--dim); font-size: 15px; }

  .plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; align-items: stretch; }
  .plan { display: flex; flex-direction: column; padding: 26px 22px; border-radius: 24px; background: var(--glass); border: 1px solid var(--edge); transition: transform .35s var(--ease), box-shadow .35s; }
  .plan:hover { transform: translateY(-6px); }
  .plan.best { border-color: var(--b); animation: glow 3.2s ease-in-out infinite; }
  .plan .tag { font-size: 12.5px; color: var(--b); text-transform: uppercase; letter-spacing: 1px; min-height: 18px; }
  .plan h3 { margin: 4px 0 2px; font-size: 22px; }
  .price { font-size: 46px; font-weight: 700; margin: 8px 0 2px; }
  .price small { font-size: 16px; font-weight: 500; color: var(--dim); }
  .plan ul { list-style: none; padding: 0; margin: 14px 0 22px; color: var(--dim); font-size: 15px; flex: 1; }
  .plan li { padding: 4px 0 4px 24px; position: relative; }
  .plan li::before { content: "\2713"; position: absolute; left: 0; color: var(--go); }
  .btn { display: block; text-align: center; padding: 14px 18px; border-radius: 14px; font: inherit; font-weight: 700; font-size: 16px; border: 0; width: 100%; color: #25103f; background: linear-gradient(90deg, var(--a), var(--b)); }
  a.btn { text-decoration: none; }
  .cta { margin-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cta small { color: var(--dim); font-size: 13.5px; }
  .btn.go { text-decoration: none; display: inline-block; width: auto; padding: 14px 28px; color: #25103f; transition: transform .3s var(--ease), box-shadow .3s; box-shadow: 0 10px 30px rgba(255,154,213,.25); }
  .btn.go:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 14px 40px rgba(143,230,255,.35); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .signup { display: flex; gap: 10px; width: 100%; max-width: 520px; flex-wrap: wrap; justify-content: center; }
  .signup input[type=email] { flex: 1 1 220px; min-width: 0; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--edge); background: rgba(255,255,255,.09); color: var(--ink); font: inherit; font-size: 16px; outline: none; transition: border-color .25s, box-shadow .25s; }
  .signup input[type=email]::placeholder { color: #8f86b3; }
  .signup input[type=email]:focus { border-color: var(--b); box-shadow: 0 0 0 3px rgba(143,230,255,.2); }
  .signup .btn { flex: 0 0 auto; cursor: pointer; }
  .signup .btn:disabled { opacity: .6; cursor: progress; }
  .signup-msg { flex: 1 1 100%; margin: 4px 0 0; min-height: 22px; font-size: 14.5px; color: var(--dim); text-align: center; }
  .signup-msg.ok { color: var(--go); } .signup-msg.bad { color: #ff9fb0; }
  .signup.done input, .signup.done .btn { display: none; }
  .signup.done .signup-msg { font-size: 16px; padding: 14px 18px; border-radius: 14px; background: rgba(185,255,214,.08); border: 1px solid rgba(185,255,214,.3); }
  .notify { text-align: center; padding: 38px 24px; border-radius: 26px; border: 1px solid var(--edge); background: linear-gradient(135deg, rgba(255,154,213,.12), rgba(143,230,255,.12)); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .notify h2 { margin: 0; } .notify p { margin: 0 0 6px; color: var(--dim); max-width: 520px; }
  .notify small { color: var(--dim); font-size: 13.5px; }
  .btn[disabled] { opacity: .55; cursor: not-allowed; background: rgba(255,255,255,.18); color: var(--ink); }

  details { border: 1px solid var(--edge); background: var(--glass); border-radius: 16px; padding: 16px 20px; margin-bottom: 12px; transition: border-color .3s, background .3s; }
  details[open] { border-color: rgba(255,154,213,.5); background: rgba(255,255,255,.09); }
  summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--a); font-size: 22px; line-height: 1; transition: transform .3s var(--ease); }
  details[open] summary::after { transform: rotate(45deg); }
  details p { margin: 12px 0 0; color: var(--dim); font-size: 15px; }
  a { color: var(--b); }

  .eq { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 56px; margin: 60px 0 6px; }
  .eq span { width: 5px; border-radius: 3px; height: 100%; background: linear-gradient(var(--a), var(--b)); transform-origin: 50% 100%; animation: eq var(--t, 1s) ease-in-out infinite alternate; opacity: .85; }
  footer { padding: 24px 0 54px; color: var(--dim); font-size: 14px; text-align: center; }

  /* scroll-in: content only starts hidden when scripting is on */
  .js .reveal { opacity: 0; transform: translateY(34px) scale(.95); transition: opacity .85s var(--ease), transform .85s var(--ease); transition-delay: var(--d, 0s); }
  .js .reveal.in { opacity: 1; transform: none; }
  .js .reveal.left { transform: translateX(-40px) scale(.97); } .js .reveal.right { transform: translateX(40px) scale(.97); }
  .js .reveal.left.in, .js .reveal.right.in { transform: none; }
  @media (max-width: 700px) { .js .reveal.left, .js .reveal.right { transform: translateY(34px) scale(.97); } .js .reveal.left.in, .js .reveal.right.in { transform: none; } }
  html { overflow-x: clip; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shine { to { background-position: -200% 0; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes ping { 70% { box-shadow: 0 0 0 9px rgba(185,255,214,0); } 100% { box-shadow: 0 0 0 0 rgba(185,255,214,0); } }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2deg); } }
  @keyframes vu { from { transform: scaleY(.18); } to { transform: scaleY(1); } }
  @keyframes slide { from { transform: translateY(0); } to { transform: translateY(-34px); } }
  @keyframes xf { from { transform: translateX(-24px); } to { transform: translateX(24px); } }
  @keyframes marq { to { transform: translateX(-50%); } }
  @keyframes eq { from { transform: scaleY(.12); } to { transform: scaleY(1); } }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 1px var(--b), 0 10px 40px rgba(143,230,255,.1); } 50% { box-shadow: 0 0 0 1px var(--b), 0 14px 60px rgba(143,230,255,.32); } }

  @media (max-width: 560px) { .chip { display: none; } .hero { padding-top: 38px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .js .reveal { opacity: 1; transform: none; }
  }

  [hidden] { display: none !important; }
  .dl { text-align: center; padding: 64px 0 40px; }
  .dl h1 { font-size: clamp(30px, 6vw, 46px); margin: 0 0 10px; }
  .dl p { color: var(--dim); margin: 0 auto 22px; max-width: 520px; }
  .dl .btn.go { font-size: 18px; padding: 16px 34px; }
  .dl .other { margin-top: 26px; font-size: 14.5px; color: var(--dim); }
  .dl .other a { color: var(--b); margin: 0 8px; white-space: nowrap; }
  .dl .ver { margin-top: 14px; font-size: 13.5px; color: var(--dim); }
  .dl .status { min-height: 22px; margin-top: 10px; color: var(--go); }
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="wrap">
  <header>
    <a class="brand" href="/" style="text-decoration:none;color:inherit"><img src="logo.svg" alt="" width="34" height="34">Autopilot <span class="grad">DJ</span></a>
  </header>
  <main class="dl">
    <h1>Download <span class="grad">Autopilot DJ</span></h1>
    <p id="lead">Choose your computer below. Free for 7 days, no card needed. Then pick a plan to keep going.</p>
    <a id="main" class="btn go" href="#" hidden>Download</a>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="other" id="other">
      <noscript>Enable JavaScript to download.</noscript>
    </div>
    <div class="ver" id="ver"></div>
  </main>
  <footer><a href="/" style="color:var(--dim)">Back to autopilotdj.com</a></footer>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ua = navigator.userAgent || "", plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
  var os = /Win/i.test(plat + ua) ? "win" : /Mac/i.test(plat) && !/iPhone|iPad/i.test(ua) ? "mac" : /iPhone|iPad|iPod|Android/i.test(ua) ? "mobile" : "other";
  fetch("/update.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (f) {
    var items = [
      { key: "mac-arm64", label: "Mac (Apple chip)", url: f.mac && f.mac.arm64 && f.mac.arm64.url },
      { key: "mac-x64", label: "Mac (Intel)", url: f.mac && f.mac.x64 && f.mac.x64.url },
      { key: "win", label: "Windows", url: f.win && f.win.x64 && f.win.x64.url }
    ].filter(function (i) { return i.url; });
    var first = os === "win" ? "win" : os === "mac" ? "mac-arm64" : null;
    var pick = items.filter(function (i) { return i.key === first; })[0];
    if (os === "mobile") $("lead").textContent = "Autopilot DJ is a desktop app. Open this page on your Mac or Windows computer to download it.";
    if (pick) { var m = $("main"); m.hidden = false; m.href = pick.url; m.textContent = "Download for " + pick.label.replace(" (Apple chip)", ""); }
    if (pick && pick.key === "mac-arm64") $("lead").textContent = "Free for 7 days, no card needed. Not sure which Mac you have? Apple menu, then About This Mac: \u201cApple M\u2026\u201d means Apple chip, \u201cIntel\u201d means Intel.";
    $("other").innerHTML = (pick ? "Other downloads: " : "Downloads: ") + items.filter(function (i) { return i !== pick; }).map(function (i) { return '<a href="' + i.url + '">' + i.label + "</a>"; }).join(" ");
    $("ver").textContent = "Latest version " + f.version;
    if (pick) $("main").addEventListener("click", function () { $("status").textContent = "Your download is starting\u2026"; });
  }).catch(function () { $("other").textContent = "Could not load the download list. Please try again."; });
})();
</script>
</body>
</html>
